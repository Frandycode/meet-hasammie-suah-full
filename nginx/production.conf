# ── nginx/production.conf ─────────────────────────────────────────────────────
#
# Production reverse proxy — sits in front of both the frontend and backend.
# Handles SSL termination, HTTP → HTTPS redirect, and routes traffic to the
# correct Docker service.
#
# Setup steps (on your Hostinger VPS):
#
#   1. Point your domain's A record to your server IP in Hostinger DNS.
#      Wait for DNS to propagate (usually 5–30 minutes).
#
#   2. Install Certbot on the server:
#        apt install certbot python3-certbot-nginx -y
#
#   3. Get your SSL certificate (free via Let's Encrypt):
#        certbot certonly --standalone \
#          -d meethasammiesuah.com \
#          -d www.meethasammiesuah.com \
#          --email your@email.com \
#          --agree-tos --non-interactive
#
#   4. Copy this file to the server and mount it in docker-compose.yml:
#        volumes:
#          - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
#          - /etc/letsencrypt:/etc/letsencrypt:ro
#
#   5. Uncomment the proxy service in docker-compose.yml and run:
#        docker compose up -d proxy
#
#   6. Auto-renew SSL (Certbot handles this, but add a cron just in case):
#        0 3 * * * certbot renew --quiet && docker compose restart proxy

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    server_name meethasammiesuah.com www.meethasammiesuah.com;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main server block ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name meethasammiesuah.com www.meethasammiesuah.com;

    # SSL certificate (issued by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/meethasammiesuah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meethasammiesuah.com/privkey.pem;

    # Modern SSL settings (A+ on SSL Labs)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Max upload size (for gallery photos)
    client_max_body_size 50M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── API routes → backend container ───────────────────────────────────────
    location /graphql {
        proxy_pass         http://api:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /track {
        proxy_pass         http://api:4000/track;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass       http://api:4000/uploads/;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://api:4000/health;
        access_log off;   # don't log health check noise
    }

    # ── Frontend → React app container ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
