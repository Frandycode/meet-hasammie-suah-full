# ── Scheduled database backup ─────────────────────────────────────────────────
#
# Runs every day at 2 AM UTC.
# SSHs into the server, dumps the Postgres database, compresses it,
# and keeps the last 30 daily backups (older ones are automatically deleted).
#
# Backups are stored on the server at: $SERVER_APP_PATH/backups/
#
# To restore from a backup:
#   gunzip sammie_backup_2025-03-15.sql.gz
#   docker compose exec -T db psql -U sammie sammie_site < sammie_backup_2025-03-15.sql
#
# Required GitHub Secrets (same as deploy.yml):
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, SERVER_APP_PATH

name: Database backup

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC every day
  workflow_dispatch:        # also allow manual trigger from GitHub UI

jobs:
  backup:
    name: Backup Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Run backup on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            BACKUP_DIR="${{ secrets.SERVER_APP_PATH }}/backups"
            DATE=$(date +%Y-%m-%d)
            FILENAME="sammie_backup_${DATE}.sql.gz"

            mkdir -p "$BACKUP_DIR"

            echo "📦  Creating backup: $FILENAME"

            # pg_dump runs inside the db container, output is piped + compressed
            docker compose -f ${{ secrets.SERVER_APP_PATH }}/docker-compose.yml \
              exec -T db pg_dump \
              -U "${POSTGRES_USER:-sammie}" \
              "${POSTGRES_DB:-sammie_site}" \
              | gzip > "$BACKUP_DIR/$FILENAME"

            echo "✅  Backup saved to $BACKUP_DIR/$FILENAME"
            echo "    Size: $(du -sh "$BACKUP_DIR/$FILENAME" | cut -f1)"

            # Keep only the last 30 backups — delete anything older
            echo "🧹  Cleaning up old backups (keeping last 30)..."
            ls -t "$BACKUP_DIR"/sammie_backup_*.sql.gz \
              | tail -n +31 \
              | xargs -r rm --

            echo "📋  Current backups:"
            ls -lh "$BACKUP_DIR"/sammie_backup_*.sql.gz 2>/dev/null || echo "  (none)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database backup failed. Check the Actions log."
          # TODO: wire in a Slack / email alert here
