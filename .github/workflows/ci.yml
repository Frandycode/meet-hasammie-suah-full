# ── CI — Meet HaSammie Suah ───────────────────────────────────────────────────
#
# Runs on every push to main and on every pull request.
# Three jobs run in parallel: backend checks, frontend checks, and a Docker
# build smoke test. All three must pass before a merge is allowed.
#
# To require these checks on GitHub:
#   Repo → Settings → Branches → Add rule → main → Require status checks

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: TypeScript + Prisma ──────────────────────────────────────────────
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meet-hasammie-suah_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: meet-hasammie-suah_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type-check
        # tsc --noEmit checks types without writing output files
        run: npx tsc --noEmit

  # ── Frontend: TypeScript + build ──────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meet-hasammie-suah_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: meet-hasammie-suah_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite build
        # A real production build — catches any import errors or missing env vars
        # We stub the required env vars so the build doesn't fail on missing keys
        env:
          VITE_API_URL: http://localhost:4000/graphql
          VITE_POSTHOG_KEY: ''
        run: npm run build

  # ── E2E: Playwright tests ──────────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # E2E needs the frontend to build first
    needs: [frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install frontend deps (for dev server)
        working-directory: meet-hasammie-suah_frontend
        run: npm ci

      - name: Install E2E deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          VITE_API_URL: http://localhost:4000/graphql
          CI: true
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
    name: Docker build smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sammie-api ./meet-hasammie-suah_backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:4000/graphql \
            -t sammie-frontend ./meet-hasammie-suah_frontend
